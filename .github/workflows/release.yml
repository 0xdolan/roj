name: Release

# Runs on a tag like v0.2.0 (see RELEASING.md): builds and tests every
# release file, publishes the GitHub release, and uploads to
# extensions.gnome.org and the PPA when those are set up.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gjs zip build-essential debhelper devscripts lintian
      - name: The tag matches every version string
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: Test and build
        run: make release-assets
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="## [$v]" 'index($0, v) == 1 {f = 1; next} /^## \[/ {f = 0} /^\[[^]]*\]: / {next} f' CHANGELOG.md > dist/NOTES.md
          printf '\n**Install**: see the [guide](https://0xdolan.github.io/roj/guide.html#start). Verify downloads with `sha256sum -c SHA256SUMS`.\n' >> dist/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*

  # Safari has no store listing: the browser extension is wrapped in a small
  # macOS app with Apple's converter and attached to the release, unsigned.
  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Safari extension
        run: node scripts/build-browser.mjs
      - name: Wrap it in a macOS app
        run: |
          v="${GITHUB_REF_NAME#v}"
          xcrun safari-web-extension-converter build/browser/safari --project-location build/xcode \
            --app-name Roj --bundle-identifier io.github.xdolan.roj --swift --macos-only --copy-resources --no-open --force
          project="$(find build/xcode -name '*.xcodeproj' -maxdepth 2 | head -1)"
          xcodebuild -project "$project" -alltargets -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= SYMROOT="$PWD/build/xcode-out" build | tail -5
          # Ad-hoc signed: Apple silicon Macs refuse to run an app with no signature at all.
          codesign --force --deep --sign - build/xcode-out/Release/Roj.app
          mkdir -p dist-safari
          ditto -c -k --keepParent build/xcode-out/Release/Roj.app "dist-safari/Roj-Safari-macOS-$v.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: safari
          path: dist-safari/*

  github-release:
    needs: [build, safari]
    # A failed Safari build must not hold back the other downloads.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: safari
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Roj ${GITHUB_REF_NAME#v}" --notes-file dist/NOTES.md \
            dist/*.zip dist/*.xpi dist/*.tar.gz dist/*.deb dist/*.ics dist/SHA256SUMS

  extensions-gnome-org:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Upload to extensions.gnome.org
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          if [ -z "$EGO_USERNAME" ] || [ -z "$EGO_PASSWORD" ]; then
            echo "extensions.gnome.org is not set up: skipping."; exit 0
          fi
          scripts/ego-upload.sh dist/roj@0xdolan.github.io.shell-extension.zip

  launchpad-ppa:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source packages to the PPA
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
          DEBEMAIL: ${{ secrets.DEBEMAIL }}
          DEBFULLNAME: ${{ secrets.DEBFULLNAME }}
          PPA: ${{ vars.PPA || 'ppa:0xdolan/roj' }}
          SERIES: ${{ vars.PPA_SERIES || 'noble resolute' }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "The PPA is not set up: skipping."; exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper devscripts dput gnupg
          GPG_KEY_ID="$(scripts/gpg-setup.sh)" scripts/ppa-upload.sh
