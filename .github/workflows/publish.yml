name: Publish

# Run by hand (Actions, Publish, or gh workflow run publish.yml): check the
# connections to extensions.gnome.org and the PPA without publishing, or
# upload a release again. Uses the same scripts as the Release workflow.

on:
  workflow_dispatch:
    inputs:
      action:
        description: check-* only test the connection; upload-* publish the tag
        type: choice
        options: [check-ego, upload-ego, check-ppa, upload-ppa]
        default: check-ego
      tag:
        description: Release tag for upload-ego and upload-ppa, like v0.2.2
        required: false
        default: ''
      revision:
        description: Debian revision for upload-ppa (raise it to upload the same version again)
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  extensions-gnome-org:
    if: startsWith(inputs.action, 'check-ego') || startsWith(inputs.action, 'upload-ego')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the release zip
        if: inputs.action == 'upload-ego'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v0.2.2"; exit 2; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.shell-extension.zip' --dir dist
      - name: extensions.gnome.org
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = check-ego ]; then
            scripts/ego-upload.sh --check
          else
            scripts/ego-upload.sh dist/roj@0xdolan.github.io.shell-extension.zip
          fi

  launchpad-ppa:
    if: startsWith(inputs.action, 'check-ppa') || startsWith(inputs.action, 'upload-ppa')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9]+$ ]] || { echo "revision must be a number"; exit 2; }
          if [ "$ACTION" = upload-ppa ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v0.2.2"; exit 2; }
          fi
      - uses: actions/checkout@v4
        if: inputs.action == 'upload-ppa'
        with:
          ref: ${{ inputs.tag }}
          path: release-source
      - name: Launchpad PPA
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
          DEBEMAIL: ${{ secrets.DEBEMAIL }}
          DEBFULLNAME: ${{ secrets.DEBFULLNAME }}
          PPA: ${{ vars.PPA || 'ppa:0xdolan/roj' }}
          SERIES: ${{ vars.PPA_SERIES || 'noble questing resolute' }}
          DEB_REVISION: ${{ inputs.revision }}
          ACTION: ${{ inputs.action }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper devscripts dput gnupg
          export GPG_KEY_ID="$(scripts/gpg-setup.sh)"
          if [ "$ACTION" = check-ppa ]; then
            CHECK=1 scripts/ppa-upload.sh
          else
            SOURCE=release-source scripts/ppa-upload.sh
          fi
