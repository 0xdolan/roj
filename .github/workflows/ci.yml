name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Git flow: main only takes develop, release/* and hotfix/* (CONTRIBUTING.md
  # rule 11). Required on main by the branch ruleset; skipped elsewhere.
  gitflow:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Source branch may merge into main
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            develop|release/*|hotfix/*) echo "$HEAD may merge into main" ;;
            *) echo "::error::$HEAD cannot merge into main. Open the pull request into develop; main takes only develop, release/* and hotfix/*."; exit 1 ;;
          esac

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gjs zip build-essential debhelper devscripts lintian
      - name: Lint, translations and tests
        run: make test
      - name: Versions agree
        run: scripts/check-version.sh
      - name: Build the extension, tarball and packages
        run: make pack dist deb calendars checksums
      - name: Lintian
        run: lintian --suppress-tags initial-upload-closes-no-bugs dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: roj-${{ github.sha }}
          path: dist/*
