<!doctype html>
<!-- Store / extensions.gnome.org screenshot: 1600×1000 -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1600px; --h: 1000px; }
  .bar { position: absolute; inset: 0 0 auto 0; height: 40px; background: #000; display: flex; align-items: center; justify-content: center; }
  .bar img { height: 30px; }
  .prefs { position: absolute; left: 90px; top: 110px; width: 700px; border-radius: 14px; }
  .popup { position: absolute; left: 720px; top: 52px; width: 430px; }
  .copy { position: absolute; right: 70px; top: 150px; width: 340px; }
  .copy h2 { font-size: 46px; font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
  .copy p { font-size: 20px; color: var(--muted); margin-top: 20px; line-height: 1.5; }
  .copy ul { list-style: none; margin-top: 28px; display: grid; gap: 12px; font-size: 19px; font-weight: 700; }
  .copy li::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 99px; background: var(--sun); margin-inline-end: 12px; vertical-align: middle; }
  .copy .brand { margin-bottom: 26px; }
  .copy .brand img { width: 58px; height: 58px; }
  .copy .brand h1 { font-size: 40px; letter-spacing: -1px; }
</style>
</head>
<body>
<div class="rays"></div>
<div class="bar"><img src="../../docs/images/screenshots/panel.png" alt=""></div>
<img class="shot prefs" src="../../docs/images/screenshots/prefs-appearance.png" alt="">
<img class="shot popup" src="../../docs/images/popup/popup-ckb-events.png" alt="">
<div class="copy">
  <div class="brand"><img src="../../assets/logo.svg" alt=""><h1>Roj</h1></div>
  <h2>Your day, the Kurdish way.</h2>
  <p>The Kurdish solar calendar in the top bar, with the Gregorian, Persian and Islamic dates side by side.</p>
  <ul>
    <li>Sorani &amp; Kurmanji</li>
    <li>Events &amp; .ics calendars</li>
    <li>Fonts per script</li>
    <li>Converter, guide &amp; CLI</li>
    <li>Light, dark &amp; system</li>
  </ul>
</div>
</body>
</html>
