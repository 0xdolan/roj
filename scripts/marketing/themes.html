<!doctype html>
<!-- Languages and themes: 1600×1000 -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1600px; --h: 1000px; }
  h2 { position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-size: 46px; font-weight: 800; letter-spacing: -1px; }
  .sub { position: absolute; left: 0; right: 0; top: 122px; text-align: center; font-size: 21px; color: var(--muted); }
  .row { position: absolute; left: 0; right: 0; top: 190px; display: flex; justify-content: center; gap: 44px; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  figure img { width: 360px; }
  figcaption { font-size: 19px; font-weight: 800; }
  figcaption span { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<div class="rays" style="opacity:.7"></div>
<h2>Your language. Your calendars. Your theme.</h2>
<p class="sub">Sorani, Kurmanji, English, Persian or Arabic, with each calendar in your language or its own, in light or dark.</p>
<div class="row">
  <figure><img class="shot" src="../../docs/images/popup/popup-ckb-dark.png" alt=""><figcaption>Sorani <span>· dark</span></figcaption></figure>
  <figure><img class="shot" src="../../docs/images/popup/popup-kmr-light.png" alt=""><figcaption>Kurmanji <span>· light</span></figcaption></figure>
  <figure><img class="shot" src="../../docs/images/popup/popup-fa-native.png" alt=""><figcaption>Persian <span>· each calendar in its own language</span></figcaption></figure>
</div>
</body>
</html>
